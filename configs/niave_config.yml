# Dataset
dataset:
  root_dir: /kaggle/input/datasets/carlolepelaars/camvid/CamVid
  image_size: [224, 224]
  ignore_index: -1

# Model
model:
  num_classes: 32 
  n_freeze_layers: 6 # range of [0,8]

# Training
training:
  epochs: 30
  batch_size: 32
  num_workers: 4
  pin_memory: true
  seed: 42
  early_stopping_patience: 4

  encoder_lr: 0.00001
  decoder_lr: 0.0001
  weight_decay: 0.0001

  scheduler_factor: 0.5
  scheduler_patience: 3
  min_lr: 0.000001

# Output
output:
  checkpoint_dir: checkpoints/naive
  log_dir: logs/naive
  best_model_name: best_model_4.pth
  last_model_name: last_model_4.pth
  log_name: train_4.log

# WandB
wandb:
  project: CamVid-Semantic-Segmentation
  run_name: naive_4
